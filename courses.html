
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart LMS - Courses</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }
        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: #1e3c72;
            color: white;
            position: fixed;
            padding: 20px;
        }
        .sidebar h2 { text-align: center; }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .sidebar a:hover { background: #2a5298; }
        .main { margin-left: 230px; padding: 30px; }
        .course-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .course {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
        }
        .course h3 { color: #1e3c72; }
        button {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 11px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #2a5298; }
        input {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        @media(max-width: 650px) {
            .sidebar { position: relative; width: 100%; min-height: auto; }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>SMART LMS</h2>
    <a href="./dashboard.html">🏠 Dashboard</a>
    <a href="./courses.html">📚 My Courses</a>
    <a href="./assignments.html">📝 Assignments</a>
    <a href="./quiz.html">📋 Online Quiz</a>
    <a href="./progress.html">📊 My Progress</a>
    <a href="./chatbot.html">🤖 AI Assistant</a>
    <a href="./profile.html">👤 Profile</a>
    <a href="./notifications.html">🔔 Notifications</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<div class="main">
    <h1>Available Courses</h1>
    <p>Explore courses and enroll to start learning.</p>

    <input type="text" id="search" placeholder="Search courses..." oninput="searchCourses()">

    <div class="course-container" id="courseContainer"></div>
</div>

<script>
let courses = [];

function displayCourses(list) {
    const container = document.getElementById("courseContainer");
    container.innerHTML = "";

    list.forEach(course => {
        const enrolled = course.enrolled;

        container.innerHTML += `
            <div class="course">
                <h3>${course.name}</h3>
                <p>${course.description}</p>
                <p><strong>Duration:</strong> ${course.duration}</p>
                <button onclick="enroll(${course.id})">
                    ${enrolled ? "Enrolled" : "Enroll Now"}
                </button>
                <button onclick="viewCourse(${course.id})">View Details</button>
            </div>
        `;
    });
}

async function enroll(id) {
    const response = await fetch(`/api/courses/${id}/enroll`, {method:"POST"});
    if (response.status === 401) return location.replace("/");
    if (!response.ok) return alert("Could not enroll. Please try again.");
    await loadCourses();
}

function viewCourse(id) {
    window.location.href = `./course-details.html?id=${id}`;
}

function searchCourses() {
    const keyword = document.getElementById("search").value.toLowerCase();
    const filtered = courses.filter(course =>
        course.name.toLowerCase().includes(keyword)
    );
    displayCourses(filtered);
}

async function loadCourses() {
    const response = await fetch("/api/courses");
    if (response.status === 401) return location.replace("/");
    courses = (await response.json()).courses;
    displayCourses(courses);
}
async function logout() { await fetch("/api/logout", {method:"POST"}); location.replace("/"); }
loadCourses();
</script>

</body>
</html>
