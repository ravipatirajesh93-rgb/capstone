
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart LMS - Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }
        .sidebar {
            width: 230px;
            height: 100vh;
            background: #1e3c72;
            color: white;
            position: fixed;
            padding: 20px;
        }
        .sidebar h2 { text-align: center; }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .sidebar a:hover { background: #2a5298; }
        .main {
            margin-left: 230px;
            padding: 30px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
        }
        .card h2 { color: #1e3c72; }
        .welcome {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        @media(max-width: 650px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }
            .main { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>SMART LMS</h2>
    <a href="./dashboard.html">🏠 Dashboard</a>
    <a href="./courses.html">📚 My Courses</a>
    <a href="./assignments.html">📝 Assignments</a>
    <a href="./quiz.html">📋 Online Quiz</a>
    <a href="./progress.html">📊 My Progress</a>
    <a href="./chatbot.html">🤖 AI Assistant</a>
    <a href="./profile.html">👤 Profile</a>
    <a href="./notifications.html">🔔 Notifications</a>
    <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<div class="main">
    <div class="welcome">
        <h1>Welcome, <span id="studentName">Student</span>!</h1>
        <p>Welcome to your Smart Learning Management System.</p>
    </div>

    <div class="cards">
        <div class="card">
            <h2 id="courseCount">0</h2>
            <p>Enrolled Courses</p>
        </div>
        <div class="card">
            <h2 id="lessonCount">0</h2>
            <p>Completed Lessons</p>
        </div>
        <div class="card">
            <h2 id="quizScore">0</h2>
            <p>Best Quiz Score</p>
        </div>
        <div class="card">
            <h2 id="assignmentCount">0</h2>
            <p>Submitted Assignments</p>
        </div>
    </div>
</div>

<script>
async function loadDashboard() {
    const [meRes, statsRes] = await Promise.all([fetch("/api/me"), fetch("/api/dashboard")]);
    if (meRes.status === 401 || statsRes.status === 401) return location.replace("/");
    const me = await meRes.json(), stats = await statsRes.json();
    document.getElementById("studentName").textContent = me.user.username;
    document.getElementById("courseCount").textContent = stats.enrolled;
    document.getElementById("lessonCount").textContent = stats.completed;
    document.getElementById("quizScore").textContent = stats.best_score;
    document.getElementById("assignmentCount").textContent = stats.submissions;
}
async function logout() { await fetch("/api/logout", {method:"POST"}); location.replace("/"); }
loadDashboard();
</script>

</body>
</html>
